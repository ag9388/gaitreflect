<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaitReflect</title>
<meta name="description" content="Beam diagnoses and repairs broken 3D robot rigs, verified by deterministic Blender walk tests and Bullet physics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Righteous&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f3;
  --surface: #fcfcfb;
  --surface-2: #efeeea;
  --border: #dcdbd5;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #2a78d6;
  --series-fixed: #2a78d6;
  --series-broken: #eb6834;
  --good: #1f7a3a;
  --good-bg: #e3f2e6;
  --bad: #b42318;
  --bad-bg: #fbe5e2;
  --warn: #9a6200;
  --code-bg: #f0efea;
  --viewer-bg: #eceae4;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #232322;
    --border: #353532;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --accent: #3987e5;
    --series-fixed: #3987e5;
    --series-broken: #d95926;
    --good: #5cc27a;
    --good-bg: #17301f;
    --bad: #f07a6e;
    --bad-bg: #3a1a17;
    --warn: #e0a640;
    --code-bg: #141413;
    --viewer-bg: #1f1f1d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232322; --border: #353532;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --series-fixed: #3987e5; --series-broken: #d95926;
  --good: #5cc27a; --good-bg: #17301f; --bad: #f07a6e; --bad-bg: #3a1a17; --warn: #e0a640;
  --code-bg: #141413; --viewer-bg: #1f1f1d; --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--accent); }
code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
section { padding: 56px 0; border-top: 1px solid var(--border); }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
h3 { font-size: 17px; font-weight: 600; }
.lede { color: var(--text-2); max-width: 720px; margin: 0 0 28px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }

/* hero */
header.hero { padding: 64px 0 40px; }
/* タイトルだけ、丸いメカ風フォント (Righteous は 1 ウェイトのみ) */
.hero h1 { font-family: "Righteous", Inter, system-ui, sans-serif; font-size: clamp(40px, 7vw, 68px); font-weight: 400; letter-spacing: 0; }
.hero h1 span { color: var(--accent); }
.hero p.sub { font-size: clamp(17px, 2.2vw, 20px); color: var(--text-2); max-width: 760px; margin: 16px 0 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; padding: 5px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
}
.chip b { color: var(--text); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 32px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.stat .v { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.stat .l { font-size: 13px; color: var(--text-2); }

/* status badges: icon + label, never color alone */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.pass { color: var(--good); background: var(--good-bg); }
.badge.fail { color: var(--bad); background: var(--bad-bg); }
.badge.pass::before { content: "✓"; }
.badge.fail::before { content: "✕"; }

/* viewers */
.viewers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.viewer { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.viewer .head { padding: 12px 14px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 84px; }
@media (max-width: 900px) { .viewer .head { min-height: 0; } }
.viewer .head h3 { font-size: 15px; }
.viewer .head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); line-height: 1.4; }
.viewer .stage { position: relative; aspect-ratio: 4 / 3.4; background: var(--viewer-bg); }
.viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.viewer .loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--text-3); }
.readout { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.readout > div { padding: 9px 14px; }
.readout > div + div { border-left: 1px solid var(--border); }
.readout .k { font-size: 11.5px; color: var(--text-3); }
.readout .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.readout .val.hot { color: var(--bad); }
.readout .val.hot::after { content: " ▲"; font-size: 10px; }

.timeline { margin-top: 16px; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
.timeline button {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; padding: 6px 14px; min-width: 84px;
}
.timeline button:hover { border-color: var(--text-3); }
.timeline input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.timeline .frame { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.legend-row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.legend-row span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.ok { background: #8d99ad; }
.sw.mid { background: #f0a541; }
.sw.hot { background: #e0473c; }
.sw.com { background: var(--accent); border-radius: 50%; }

/* loop */
.loop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; counter-reset: step; }
.step { position: relative; background: var(--surface); border: 1px solid var(--border); padding: 18px 18px 18px; }
.step:first-child { border-radius: 12px 0 0 12px; }
.step:last-child { border-radius: 0 12px 12px 0; }
.step + .step { border-left: none; }
.step .n { font-size: 12px; font-weight: 600; color: var(--text-3); }
.step h3 { margin: 4px 0 6px; }
.step p { margin: 0; font-size: 14px; color: var(--text-2); }
.step .who { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
.step .who.beam { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.loop-note { margin-top: 12px; font-size: 14px; color: var(--text-2); }

/* compare */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 14px; margin: 0 0 14px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--border); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 14px; color: var(--text-2); }
blockquote .tag { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-3); margin-bottom: 3px; }
blockquote.wrong { border-left-color: var(--bad); }
blockquote.right { border-left-color: var(--good); }
.verdict { font-size: 12.5px; font-weight: 600; margin-top: 6px; }
.verdict.wrong { color: var(--bad); }
.verdict.right { color: var(--good); }

.evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.evidence .card h3 { margin-bottom: 6px; }
.evidence .card p { margin: 0; font-size: 14px; color: var(--text-2); }
.evidence .card code { font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* chart */
.chart-card { padding: 20px 22px 14px; }
.chart-card h3 { margin-bottom: 2px; }
.chart-card .sub { font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
.chart-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
.chart-legend i { width: 18px; height: 2px; display: inline-block; border-radius: 2px; }
#comChart { position: relative; }
#comChart svg { width: 100%; height: auto; display: block; overflow: visible; }
#comChart .tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  opacity: 0; transition: opacity .1s; white-space: nowrap; color: var(--text);
}
#comChart .tip .row { display: flex; align-items: center; gap: 7px; }
#comChart .tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.table-toggle { margin-top: 8px; font-size: 13px; }
.table-toggle summary { cursor: pointer; color: var(--text-2); }
.table-toggle table { border-collapse: collapse; font-size: 12.5px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.table-toggle td, .table-toggle th { padding: 3px 12px 3px 0; text-align: right; border-bottom: 1px solid var(--border); }
.table-toggle th { color: var(--text-3); font-weight: 500; }
.table-scroll { max-height: 240px; overflow: auto; }

/* bench */
.bench-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; align-items: start; }
#benchChart { position: relative; }
#benchChart svg { width: 100%; height: auto; display: block; overflow: visible; }
#benchChart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); opacity: 0; transition: opacity .1s; white-space: nowrap; color: var(--text); }
table.levels { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-top: 8px; }
table.levels th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 0 8px 6px 0; }
table.levels td { padding: 8px 8px 8px 0; border-top: 1px solid var(--border); }
table.levels td.big { font-weight: 700; font-size: 16px; }
table.levels .lv { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
table.levels .lv i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
table.levels .d { display: block; font-size: 12px; color: var(--text-3); font-weight: 400; }
.note { font-size: 13.5px; color: var(--text-2); margin: 12px 0 0; }
.sub-h { margin: 36px 0 6px; font-size: 20px; }
.fm .ep { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--text-3); }
.fm blockquote { margin-top: 10px; }
.fm .truth { font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
.fixed-quote { margin-top: 14px; }
.fixed-quote blockquote { margin-top: 6px; }
:root { --lv1: #6da7ec; --lv2: #2a78d6; --lv3: #104281; }   /* 順序のある 3 段 (validate_palette --ordinal で確認) */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lv1: #1c5cab; --lv2: #5598e7; --lv3: #b7d3f6; } }
:root[data-theme="dark"] { --lv1: #1c5cab; --lv2: #5598e7; --lv3: #b7d3f6; }
@media (max-width: 900px) { .bench-grid { grid-template-columns: 1fr; } }
.ep-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.ep-bar label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.ep-bar select {
  font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 100%;
}
.ep-truth { display: flex; flex-wrap: wrap; gap: 6px; }
.ep-truth .chip { font-size: 12px; padding: 3px 9px; }
.bench-viewers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.bench-viewers .viewer .head { min-height: 64px; }
.bench-viewers .viewer .stage { aspect-ratio: 3 / 3.4; }
.loading-row { grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-3); font-size: 14px; }
details.diag { margin-top: 14px; }
#epDiag { display: grid; gap: 10px; }
#epDiag .lvd { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
#epDiag .lvd ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); }
@media (max-width: 1100px) { .bench-viewers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .bench-viewers { grid-template-columns: 1fr; } .bench-viewers .viewer .head { min-height: 0; } }

/* explorer */
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 18px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: transparent; color: var(--text-2); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.round { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.round .rh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.round .rh h3 { font-size: 15px; }
.round .rh .meta { margin-left: auto; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.round .rb { padding: 14px 18px; }
.round ul.analysis { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.round ul.analysis li { font-size: 14px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; }
.round ul.analysis .id { font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 500; color: var(--text-3); padding-top: 1px; }
.round .err { margin: 0 0 12px; }
.round .err .t { font-size: 12.5px; font-weight: 600; color: var(--bad); margin-bottom: 4px; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 420px; }
details.code > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.expected { font-size: 13.5px; color: var(--text-2); margin-top: 10px; }
.final { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 12px 18px; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }

/* run */
.run-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; align-items: start; }
.files { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.files li { font-size: 14px; color: var(--text-2); }
.files a { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500; }
footer { padding: 32px 0 56px; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-3); }

@media (max-width: 900px) {
  .viewers { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .loop { grid-template-columns: 1fr 1fr; }
  .step:first-child { border-radius: 12px 0 0 0; }
  .step:nth-child(2) { border-radius: 0 12px 0 0; }
  .step:nth-child(3) { border-radius: 0 0 0 12px; border-left: 1px solid var(--border); border-top: none; }
  .step:last-child { border-radius: 0 0 12px 0; border-top: none; }
  .compare, .evidence, .run-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  section { padding: 40px 0; }
  .loop { grid-template-columns: 1fr; }
  .step, .step:first-child, .step:nth-child(2), .step:nth-child(3), .step:last-child { border-radius: 0; border: 1px solid var(--border); border-top: none; }
  .step:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .step:last-child { border-radius: 0 0 12px 12px; }
  .timeline { flex-wrap: wrap; }
  .timeline input[type=range] { flex-basis: 100%; order: 3; }
}

/* v2 */
.changes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.changes .card h3 { margin-bottom: 6px; }
.changes .card p { margin: 0; font-size: 14px; color: var(--text-2); }
.changes .card .was { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 8px; }
.showcase { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.showcase img { width: 100%; height: auto; display: block; background: #fff; }
.showcase .cap { font-size: 13px; color: var(--text-2); padding: 10px 14px; border-top: 1px solid var(--border); }
.sw.front { background: #ff7f1f; }
.sw.sup { background: rgba(90, 170, 240, .55); border: 1px solid #3a86c8; }
.state { font-size: 12px; font-weight: 600; color: var(--bad); min-height: 1em; }
.lv-tabs { margin-top: 18px; }
@media (max-width: 1000px) { .changes { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .changes { grid-template-columns: 1fr; } }
</style>
